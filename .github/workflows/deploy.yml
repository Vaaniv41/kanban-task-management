name: Build and deploy Kanban

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanban-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy to AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: ap-south-1
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_frontend_image: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-frontend:${{ github.sha }}
      TF_VAR_backend_image: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-backend:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repositories exist
        shell: bash
        run: |
          for repository in kanban-frontend kanban-backend; do
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repository" >/dev/null
            fi
          done

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-frontend:${{ github.sha }}
          build-args: REACT_APP_BASEURL=

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-backend:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Apply infrastructure and deploy services
        run: terraform apply -input=false -auto-approve

      - name: Show application URL
        run: terraform output -raw alb_dns_name
