name: CI/CD - Build and Deploy Kanban

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: kanban-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

  FRONTEND_IMAGE: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-frontend:${{ github.sha }}
  BACKEND_IMAGE: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-backend:${{ github.sha }}

jobs:

  # ============================================================
  # CI - Build and Push Docker Images
  # ============================================================
  ci:
    name: CI - Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Debug GitHub OIDC claims
      # ----------------------------------------------------------
      # This does NOT print the actual OIDC token.
      # It only prints selected claims from the token so that
      # we can verify the IAM trust policy.
      # ----------------------------------------------------------
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GitHub OIDC Debug Information"
          echo "======================================"

          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Repository owner:"
          echo "${GITHUB_REPOSITORY_OWNER}"

          echo ""
          echo "Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "Workflow:"
          echo "${GITHUB_WORKFLOW}"

          echo ""
          echo "Requesting OIDC token claims..."

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "${OIDC_RESPONSE}" | jq -r '.value')

          if [ -z "${OIDC_TOKEN}" ] || [ "${OIDC_TOKEN}" = "null" ]; then
            echo "ERROR: Could not obtain GitHub OIDC token."
            exit 1
          fi

          echo ""
          echo "OIDC claims:"
          
          OIDC_PAYLOAD=$(echo "${OIDC_TOKEN}" \
            | cut -d '.' -f 2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null)

          echo "${OIDC_PAYLOAD}" | jq '{
            sub,
            aud,
            repository,
            repository_owner,
            ref,
            ref_type,
            workflow,
            event_name
          }'

          echo ""
          echo "======================================"
          echo "OIDC debug completed"
          echo "======================================"

      # ----------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598606890027:role/github-actions-kanban
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Ensure ECR repositories exist
      # ----------------------------------------------------------
      - name: Ensure ECR repositories exist
        shell: bash
        run: |
          for repository in kanban-frontend kanban-backend; do
            if ! aws ecr describe-repositories \
              --repository-names "$repository" \
              >/dev/null 2>&1; then

              echo "Creating ECR repository: $repository"

              aws ecr create-repository \
                --repository-name "$repository" \
                >/dev/null
            else
              echo "ECR repository already exists: $repository"
            fi
          done

      # ----------------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------------
      # Set up Docker Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Build and push frontend image
      # ----------------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: |
            REACT_APP_BASEURL=

      # ----------------------------------------------------------
      # Build and push backend image
      # ----------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}


  # ============================================================
  # CD - Terraform + ECS Deployment
  # ============================================================
  cd:
    name: CD - Deploy Infrastructure and ECS Services
    runs-on: ubuntu-latest

    # CD runs only after CI succeeds
    needs: ci

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ap-south-1

      # --------------------------------------------------------
      # Database secrets
      # --------------------------------------------------------
      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      # --------------------------------------------------------
      # Docker image variables passed to Terraform
      # --------------------------------------------------------
      TF_VAR_frontend_image: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-frontend:${{ github.sha }}
      TF_VAR_backend_image: 598606890027.dkr.ecr.ap-south-1.amazonaws.com/kanban-backend:${{ github.sha }}

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598606890027:role/github-actions-kanban
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Set up Terraform
      # ----------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ----------------------------------------------------------
      # Initialize Terraform
      # ----------------------------------------------------------
      - name: Initialize Terraform
        run: terraform init -input=false

      # ----------------------------------------------------------
      # Validate Terraform
      # ----------------------------------------------------------
      - name: Validate Terraform
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Apply infrastructure and deploy services
        run: terraform apply -input=false -auto-approve

      # ----------------------------------------------------------
      # Show application URL
      # ----------------------------------------------------------
      - name: Show application URL
        run: |
          echo "======================================"
          echo "Kanban application deployed successfully"
          echo "======================================"
          echo "Application URL:"
          terraform output -raw alb_dns_name